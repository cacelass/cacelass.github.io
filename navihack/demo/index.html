<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8f7f4">
<meta name="description" content="TinyVigo: la Navidad de Vigo en un mapa ilustrado. Qué hay, si está abierto ahora y un paseo a pie a tu medida.">
<title>TinyVigo</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="ui/css/tokens.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/about.css">
<link rel="stylesheet" href="css/points.css">
</head>
<body>
<div id="map" aria-label="Mapa isométrico de Vigo"></div>
<div id="zoom"><button id="zoom-in" aria-label="Acercar"><span data-lu="plus"></span></button><button id="zoom-out" aria-label="Alejar"><span data-lu="minus"></span></button></div>
<button class="tv-theme" data-theme-toggle aria-label="Cambiar tema"><span class="lu"></span></button>
<script src="ui/assets/theme.js"></script>
<script>/* el visor es nocturno: oscuro por defecto salvo elección guardada o #light (auditoria-ui.md) */ try { if (!localStorage.getItem("tinyvigo-theme") && location.hash !== "#light") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }</script>
<script src="ui/assets/lucide.js"></script>
<script src="vendor/openseadragon.min.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/sheets.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/about.js"></script>
<script src="js/points.js"></script>
<script src="js/transit.js"></script>
<script src="js/planner.js"></script>
<script src="js/getthere.js"></script>
<script src="js/tour.js"></script>
<script src="js/city.js"></script>
<script src="js/events.js"></script>
<script src="js/search.js"></script>
<script src="js/share.js"></script>
<script src="js/settings.js"></script>
<script src="js/ambient.js"></script>
<script src="js/track.js"></script>
</body>
</html>
