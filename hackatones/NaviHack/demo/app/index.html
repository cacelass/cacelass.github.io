<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TinyVigo</title>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('tinyvigo-theme'); } catch (e) {}
      var h = location.hash.indexOf('dark') > -1 ? 'dark' : location.hash.indexOf('light') > -1 ? 'light' : null;
      var th = h || t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', th);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
