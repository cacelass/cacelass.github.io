<script>
function seededRandom(seed){var x=Math.sin(seed)*10000;return x-Math.floor(x)}
function generateHistory(ticker){
  var seed=0;for(var i=0;i<ticker.length;i++)seed+=ticker.charCodeAt(i)*(i+1);
  var n=60;var labels=[];var actual=[];var predicted=[];
  var trend=0;var vol=0.8;
  var drift=(ticker==='TSLA'?1.5:ticker==='NVDA'?1.2:0.5)/60;
  for(var i=0;i<n;i++){
    var d=new Date(2025,9,1+i*5);
    labels.push((d.getMonth()+1)+'/'+d.getDate());
    var r=seededRandom(seed+i*3)*2-1;
    trend+=drift+r*vol/100;
    actual.push(+trend.toFixed(2));
    var noise=seededRandom(seed+i*7)*0.6-0.3;
    var pred=targeted(trend,noise,i,seed);
    predicted.push(+pred.toFixed(2));
  }
  return{labels:labels,actual:actual,predicted:predicted};
}
function targeted(actual,noise,i,seed){
  var lag=i>0?seededRandom(seed+i*11)*0.3:0;
  return actual*(0.85+seededRandom(seed+i*17)*0.25)+noise;
}
var chart=null;
var select=document.getElementById('ticker-select');
var tname={AAPL:'Apple',MSFT:'Microsoft',GOOGL:'Alphabet',AMZN:'Amazon',META:'Meta',TSLA:'Tesla',NVDA:'NVIDIA'};

function renderChart(ticker){
  if(chart)chart.destroy();
  var hist=generateHistory(ticker);
  var lastActual=hist.actual[hist.actual.length-1];
  var lastPred=hist.predicted[hist.predicted.length-1];
  var totalActual=hist.actual[hist.actual.length-1]-hist.actual[0];
  var totalPred=hist.predicted[hist.predicted.length-1]-hist.predicted[0];
  document.getElementById('chart-title').innerHTML=ticker+' <small>'+tname[ticker]+' · retorno acumulado (base 100)</small>';
  document.getElementById('chart-stats').innerHTML='<span class="stat">Real: <strong>'+totalActual.toFixed(2)+'%</strong></span><span class="stat">Pred: <strong>'+totalPred.toFixed(2)+'%</strong></span>';
  var ctx=document.getElementById('predictionChart').getContext('2d');
  var isDark=document.documentElement.dataset.theme==='dark';
  var gridColor=isDark?'rgba(235,237,240,0.08)':'rgba(38,38,38,0.08)';
  var tickColor=isDark?'rgba(235,237,240,0.5)':'rgba(38,38,38,0.5)';
  chart=new Chart(ctx,{
    type:'line',
    data:{
      labels:hist.labels,
      datasets:[
        {label:'Real',data:hist.actual,borderColor:isDark?'#ebedf0':'#262626',borderWidth:1.8,pointRadius:0,pointHoverRadius:4,tension:0.15,fill:true,backgroundColor:isDark?'rgba(235,237,240,0.04)':'rgba(38,38,38,0.03)'},
        {label:'Predicho',data:hist.predicted,borderColor:isDark?'rgba(235,237,240,0.6)':'rgba(38,38,38,0.55)',borderWidth:1.5,borderDash:[5,4],pointRadius:0,pointHoverRadius:4,tension:0.15,fill:false}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:true,
      interaction:{intersect:false,mode:'index'},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:isDark?'#22252a':'#f6f6f6',
          titleColor:isDark?'#ebedf0':'#262626',
          bodyColor:isDark?'rgba(235,237,240,0.8)':'rgba(38,38,38,0.75)',
          titleFont:{family:'Space Grotesk',size:13,weight:'500'},
          bodyFont:{family:'JetBrains Mono',size:12},
          padding:10,cornerRadius:6,borderWidth:1,borderColor:isDark?'rgba(235,237,240,0.15)':'rgba(38,38,38,0.1)',
          callbacks:{
            title:function(items){return items[0].label},
            label:function(c){return c.dataset.label+': '+c.parsed.y.toFixed(2)}
          }
        }
      },
      scales:{
        y:{
          min:Math.min(Math.min.apply(null,hist.actual),Math.min.apply(null,hist.predicted))-0.3,
          max:Math.max(Math.max.apply(null,hist.actual),Math.max.apply(null,hist.predicted))+0.3,
          ticks:{font:{family:'JetBrains Mono',size:10},color:tickColor,stepSize:1},
          grid:{color:gridColor}
        },
        x:{
          ticks:{font:{family:'JetBrains Mono',size:10},color:tickColor,maxRotation:45,callback:function(val,idx){return idx%3===0?this.getLabelForValue(val):''}},
          grid:{display:false}
        }
      },
      animation:{duration:800,easing:'easeOutQuart'}
    }
  });
}

select.addEventListener('change',function(){renderChart(this.value)});
renderChart('AAPL');
</script>
